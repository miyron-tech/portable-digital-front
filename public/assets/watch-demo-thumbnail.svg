<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="smoke" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.018" numOctaves="4" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="120" xChannelSelector="R" yChannelSelector="G" result="warped"/>
      <feGaussianBlur in="warped" stdDeviation="6"/>
    </filter>
    <filter id="wisps" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.02 0.035" numOctaves="3" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="70" xChannelSelector="G" yChannelSelector="R" result="warped"/>
      <feGaussianBlur in="warped" stdDeviation="2.2"/>
    </filter>
    <radialGradient id="red" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff3a2e"/>
      <stop offset=".55" stop-color="#a3121c" stop-opacity=".75"/>
      <stop offset="1" stop-color="#3a0408" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#58a8ff"/>
      <stop offset=".55" stop-color="#1840b8" stop-opacity=".75"/>
      <stop offset="1" stop-color="#06123d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="#0a1216"/>
  <g filter="url(#smoke)">
    <ellipse cx="140" cy="225" rx="200" ry="165" fill="url(#red)"/>
    <ellipse cx="285" cy="165" rx="190" ry="165" fill="url(#blue)"/>
  </g>
  <g filter="url(#wisps)" opacity=".55">
    <ellipse cx="205" cy="200" rx="95" ry="40" fill="#ffd9d0" opacity=".35" transform="rotate(-24 205 200)"/>
    <ellipse cx="240" cy="235" rx="70" ry="22" fill="#cfe4ff" opacity=".4" transform="rotate(18 240 235)"/>
  </g>
</svg>
